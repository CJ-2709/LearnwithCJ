document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"a5f82796-2d6d-4dc9-862c-b4b42660aec0\"><\u002Fscript>\n<script src=\"3a317e19-193e-4c4d-acd4-ff2f78c8f7d9\"><\u002Fscript>\n<script src=\"86815ce2-44c7-4d05-907c-23061c063e35\"><\u002Fscript>\n<style>\n  html { scroll-behavior: smooth; }\n  body { background: #ffffff; }\n  .reveal-panel { display: none; }\n  .reveal-panel.open { display: block; }\n  @keyframes penFlash { 0% { box-shadow: 0 0 0 4px var(--color-accent); } 100% { box-shadow: var(--shadow-sm); } }\n  .pen-hi { animation: penFlash 2.6s ease-out; }\n  .print-only { display: none; }\n  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\n  #ink-canvas { position: absolute; left: 0; top: 0; z-index: 20; pointer-events: none; }\n  .print-footer { display: none; }\n  @media print {\n    @page {\n      size: A4;\n      margin: 14mm 12mm 20mm;\n      @bottom-right { content: \"Page \" counter(page) \" of \" counter(pages); font-family: 'Figtree', sans-serif; font-size: 10px; color: #555; }\n    }\n    html, body { background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n    .no-print { display: none !important; }\n    #ink-canvas { display: none !important; }\n    .print-only { display: block !important; }\n    .reveal-panel { display: block !important; }\n    .app-wrap { max-width: none !important; padding: 0 !important; display: block !important; }\n    .pen-card { break-inside: avoid; box-shadow: none !important; background: #fff !important; }\n    .top-card, .legend-box, section, article, tr { break-inside: avoid; }\n    .print-footer {\n      display: flex !important; position: fixed; left: 0; right: 0; bottom: 4mm;\n      align-items: center; gap: 9px; padding: 0 2mm;\n    }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"no-print\" style=\"position:sticky;top:0;z-index:30;background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--color-divider);\">\n  <div style=\"max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 24px;\">\n    <div style=\"font-family: var(--font-heading); font-size: 18px; color: var(--color-neutral-700); border-left: 1px solid var(--color-divider); padding-left: 14px; text-transform: uppercase\">Corporate &amp; Other Laws<\u002Fdiv><div style=\"font-family: var(--font-heading); font-size: 18px; letter-spacing: -0.01em; text-transform: uppercase\">Penalties Master<\u002Fdiv>\n    \n    <div style=\"margin-left:auto;display:flex;gap:8px;\">\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onExpandAll }}\" style=\"font-family: Figtree; font-weight: 700\">{{ expandLabel }}<\u002Fbutton>\n      <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onPrint }}\" style=\"font-family: Figtree\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9V2h12v7\"><\u002Fpath><path d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"><\u002Fpath><path d=\"M6 14h12v8H6z\"><\u002Fpath><\u002Fsvg>\n        Print / Save PDF\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"app-wrap\" style=\"max-width:1120px;margin:0 auto;padding:0 24px 80px;display:flex;flex-direction:column;\">\n\n  <!-- TITLE -->\n  <section style=\"order:1;padding:48px 0 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:28px;flex-wrap:wrap;\">\n    \n    <div style=\"flex:1;min-width:280px;\">\n      \n      <span style=\"display:inline-block;font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-2-800);background:var(--color-accent-2-100);padding:5px 14px;border-radius:999px;margin-bottom:18px;\">CA Intermediate · Sept 2026 onwards<\u002Fspan><h1 style=\"font-size:clamp(26px,3.9vw,44px);line-height:1.05;margin:0;color:var(--color-text);text-transform:uppercase;white-space:nowrap;\">All penalties, at one place.<\u002Fh1>\n      <div style=\"font-family:var(--font-body);font-weight:700;font-size:19px;margin-top:20px;color:var(--color-text);\">Compiled by CA Chaitanya Jain <span style=\"color:var(--color-accent);\">(CJ Sir)<\u002Fspan><\u002Fdiv>\n      <div style=\"font-size:14px;color:var(--color-neutral-700);margin-top:6px;\">A colour-coded revision reference you can filter and print.<\u002Fdiv>\n    <\u002Fdiv><div style=\"position:relative;width:150px;height:150px;flex:none;\">\n      <image-slot id=\"cj-seal\" shape=\"rect\" placeholder=\"Drop your seal / stamp\" src=\"583f1bc7-7120-4cf9-9d29-1f33fc609b1a\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- HOW TO USE -->\n  <section style=\"order:2;margin-top:34px;border-radius:var(--radius-lg);background:var(--color-surface);box-shadow:var(--shadow-sm);overflow:hidden;\">\n    <div style=\"padding:20px 26px;background:var(--color-accent-2-100);\">\n      <h2 style=\"font-size: 26px; margin: 0; text-transform: uppercase; font-weight: 600; font-family: Figtree; color: #E64E11\">How to use this document<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"padding: 24px 26px; background-color: var(--color-neutral-100)\">\n      <ul style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:11px;font-size:15px;line-height:1.55;\">\n        <li><strong>Pick a chapter or a group.<\u002Fstrong> Use the Index or the filters to show exactly what you want — by chapter, who is liable, severity, or importance (IMP, PYQ, most likely, worth reading).<\u002Fli>\n        <li><strong>Read each card at a glance.<\u002Fstrong> Every card is colour-coded — its tint and stripe show the severity, and the chapter tag shows where it belongs.<\u002Fli>\n        <li><strong>Tap to go deeper.<\u002Fstrong> Open <strong>⚠ Takeaway<\u002Fstrong> for the point to remember, and <strong>🔗 Connected<\u002Fstrong> for penalties that carry the same figures.<\u002Fli>\n        <li><strong>Page numbers are the ICAI module.<\u002Fstrong> Each card shows the page in the ICAI Study Material provided by the Institute of Chartered Accountants of India, so you can read the full provision there.<\u002Fli>\n        <li><strong>Print what you filter.<\u002Fstrong> Whatever you leave on screen is what saves as a clean A4 PDF — page numbers and the logo appear on every page.<\u002Fli>\n      <\u002Ful>\n\n      <div style=\"height:1px;background:var(--color-divider);margin:26px 0 22px;\"><\u002Fdiv>\n\n      <h3 style=\"font-size: 20px; margin: 0 0 4px; font-family: Figtree; font-weight: 700; text-transform: uppercase\">Anatomy of a penalty card<\u002Fh3>\n      <p style=\"font-size:13px;color:var(--color-neutral-700);margin:0 0 18px;\">Every penalty below is shown the same way. Here is what each part means — the numbers on this sample match the notes beside it.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:minmax(300px,1.15fr) minmax(260px,1fr);gap:28px;align-items:start;\">\n        <!-- SAMPLE CARD (replica) -->\n        <article style=\"display:grid;grid-template-columns:9px 1fr;border-radius:var(--radius-md);overflow:hidden;border:1px solid color-mix(in srgb,#c98a12 45%,var(--color-bg));background:color-mix(in srgb,#c98a12 8%,var(--color-bg));box-shadow:var(--shadow-sm);\">\n          <div style=\"background:#c98a12;\"><\u002Fdiv>\n          <div style=\"padding:16px 18px;\">\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px;\">{{ an1 }}<span style=\"font-family:var(--font-body);font-weight:700;font-size:15px;background:#c67139;color:#fff;padding:4px 13px;border-radius:999px;\">2.8<\u002Fspan><\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;\">{{ an2 }}<span style=\"font-family:var(--font-body);font-weight:700;font-size:12px;padding:4px 11px;border-radius:999px;background:#c67139;color:#fff;white-space:nowrap;\">🎯 PYQ<\u002Fspan><span style=\"font-family:var(--font-body);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;border:1.5px solid #c67139;color:#9a5228;\">🎯 M'26<\u002Fspan><\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#9a6a0e;margin-left:auto;\">{{ an3 }}<span style=\"width:9px;height:9px;border-radius:50%;background:#c98a12;\"><\u002Fspan>Imprisonment possible<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;margin-top:12px;\">{{ an4 }}<span style=\"font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:0.04em;text-transform:uppercase;color:#9a5228;\">Section 12(8) <span style=\"color:var(--color-neutral-500);font-weight:500;text-transform:none;letter-spacing:0;\">· ICAI Module, page 2.40<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:flex-start;gap:6px;margin-top:7px;\">{{ an5 }}<span style=\"font-family:var(--font-body);font-weight:700;font-size:19px;line-height:1.32;text-wrap:pretty;\">Default in maintaining the registered office of the company<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:11px;\">{{ an6 }}<span style=\"font-family:var(--font-body);font-weight:600;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--color-accent-2-100);color:var(--color-accent-2-800);\">Company<\u002Fspan><span style=\"font-family:var(--font-body);font-weight:600;font-size:11px;padding:3px 10px;border-radius:999px;background:var(--color-accent-2-100);color:var(--color-accent-2-800);\">Officer<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:stretch;gap:6px;margin-top:12px;\">\n              {{ an7 }}\n              <div style=\"flex:1;display:grid;grid-template-columns:1.1fr 0.9fr 1.2fr;gap:1px;background:var(--color-divider);border-radius:12px;overflow:hidden;\">\n                <div style=\"background:var(--color-neutral-100);padding:9px 11px;\"><div style=\"font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:4px;font-weight:700;\">Fine / Amount<\u002Fdiv><div style=\"font-size:13px;line-height:1.4;\">₹1,000 per day, up to ₹1,00,000<\u002Fdiv><\u002Fdiv>\n                <div style=\"background:var(--color-neutral-100);padding:9px 11px;\"><div style=\"font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:4px;font-weight:700;\">Imprisonment<\u002Fdiv><div style=\"font-size:13px;line-height:1.4;\">— None<\u002Fdiv><\u002Fdiv>\n                <div style=\"background:var(--color-neutral-100);padding:9px 11px;\"><div style=\"font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:4px;font-weight:700;\">Who is liable / responsible<\u002Fdiv><div style=\"font-size:13px;line-height:1.4;\">Company &amp; every officer in default<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;margin-top:12px;\">{{ an8 }}<span style=\"display:inline-flex;gap:8px;\"><span style=\"font-family:var(--font-body);font-weight:600;font-size:11px;padding:4px 12px;border-radius:999px;border:1px solid var(--color-divider);\">⚠ Show exam takeaway<\u002Fspan><span style=\"font-family:var(--font-body);font-weight:600;font-size:11px;padding:4px 12px;border-radius:999px;border:1px solid var(--color-divider);\">🔗 Show connected<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n\n        <!-- NUMBERED NOTES -->\n        <div style=\"display:flex;flex-direction:column;gap:11px;font-size:13.5px;line-height:1.45;\">\n          <div style=\"display:flex;gap:9px;\">{{ an1 }}<div><strong>Penalty number.<\u002Fstrong> Chapter.item code (2.8 = Chapter 2, penalty 8).<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\">{{ an2 }}<div><strong>Importance tag.<\u002Fstrong> 🎯&nbsp;PYQ (previously asked), 🔥&nbsp;Most likely next, or ⭐&nbsp;Worth reading — each in its own colour — with the attempt it came in, e.g. M'26.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\">{{ an3 }}<div><strong>Severity.<\u002Fstrong> <span style=\"color:#3f7d52;font-weight:700;\">Green<\u002Fspan> = fine only · <span style=\"color:#c98a12;font-weight:700;\">Amber<\u002Fspan> = imprisonment possible · <span style=\"color:#c0392b;font-weight:700;\">Red<\u002Fspan> = fraud, Section 447. The card is tinted the same colour.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\">{{ an4 }}<div><strong>Section &amp; page.<\u002Fstrong> The exact section, and the page in the ICAI module to read it in full.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\">{{ an5 }}<div><strong>Nature of the penalty.<\u002Fstrong> What the default actually is — the big heading on every card.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\">{{ an6 }}<div><strong>Who is liable / responsible.<\u002Fstrong> Who has to pay — Company, Officer, Any Person, or LLP / Partner.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\">{{ an7 }}<div><strong>The figures.<\u002Fstrong> Fine, imprisonment, and who is liable — side by side.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:9px;\">{{ an8 }}<div><strong>Go deeper.<\u002Fstrong> ⚠&nbsp;Takeaway for the exam point, 🔗&nbsp;Connected for penalties with the same figures.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- INDEX -->\n  <section id=\"index\" style=\"order: 3; margin-top: 56px; background-color: var(--color-neutral-100)\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;padding-bottom:12px;margin-bottom:10px;flex-wrap:wrap;\">\n      \n      <h2 style=\"font-size: 30px; margin: 0; text-transform: uppercase\">Index<\u002Fh2><span style=\"font-size: 13px; color: var(--color-neutral-600)\">Tap a chapter — or a 🎯 / 🔥 / ⭐ count — to filter the list below<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);background:var(--color-surface);\">\n    <sc-raw-table class=\"table\" style=\"margin:0;\">\n      <sc-raw-thead><sc-raw-tr>\n        <sc-raw-th style=\"width: 56px; font-size: 13px; text-align: center\">Ch.<\u002Fsc-raw-th>\n        <sc-raw-th style=\"font-size: 13px; text-align: center\">Chapter<\u002Fsc-raw-th>\n        <sc-raw-th style=\"width: 78px; text-align: right; font-size: 13px\">Penalties<\u002Fsc-raw-th>\n        <sc-raw-th style=\"width: 58px; text-align: center; font-weight: 800; font-size: 20px\">🎯<\u002Fsc-raw-th>\n        <sc-raw-th style=\"width: 58px; text-align: center; font-weight: 800; font-size: 20px\">🔥<\u002Fsc-raw-th>\n        <sc-raw-th style=\"width: 58px; text-align: center; font-weight: 800; font-size: 20px\">⭐<\u002Fsc-raw-th>\n      <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n      <sc-raw-tbody>\n        <sc-for list=\"{{ chapterIndex }}\" as=\"ci\" hint-placeholder-count=\"11\">\n          <sc-raw-tr>\n            <sc-raw-td sc-camel-on-click=\"{{ ci.onAll }}\" style=\"cursor: pointer; background-color: var(--color-accent-100)\"><span style=\"display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 9px;border-radius:999px;font-family:var(--font-body);font-weight:700;font-size:16px;color:#fff;background:{{ ci.color }};\">{{ ci.ch }}<\u002Fspan><\u002Fsc-raw-td>\n            <sc-raw-td sc-camel-on-click=\"{{ ci.onAll }}\" style=\"cursor: pointer; background-color: var(--color-accent-100)\">{{ ci.shortTitle }}<\u002Fsc-raw-td>\n            <sc-raw-td sc-camel-on-click=\"{{ ci.onAll }}\" style=\"cursor: pointer; text-align: center; font-weight: 600; background-color: var(--color-accent-100)\">{{ ci.count }}<\u002Fsc-raw-td>\n            <sc-raw-td sc-camel-on-click=\"{{ ci.asked.on }}\" style=\"background-color: var(--color-accent-100); text-align: center\">{{ ci.asked.v }}<\u002Fsc-raw-td>\n            <sc-raw-td sc-camel-on-click=\"{{ ci.likely.on }}\" style=\"background-color: var(--color-accent-100); text-align: center\">{{ ci.likely.v }}<\u002Fsc-raw-td>\n            <sc-raw-td sc-camel-on-click=\"{{ ci.read.on }}\" style=\"background-color: var(--color-accent-100); text-align: center\">{{ ci.read.v }}<\u002Fsc-raw-td>\n          <\u002Fsc-raw-tr>\n        <\u002Fsc-for>\n        <sc-raw-tr style=\"background:var(--color-accent-2-100);\">\n          <sc-raw-td><\u002Fsc-raw-td>\n          <sc-raw-td style=\"font-family:var(--font-heading);font-size:15px;\">TOTAL — ALL CHAPTERS<\u002Fsc-raw-td>\n          <sc-raw-td style=\"text-align: center; font-family: Figtree; font-weight: 700\">{{ total.count }}<\u002Fsc-raw-td>\n          <sc-raw-td style=\"text-align: center; font-family: Figtree; color: #c67139; font-weight: 700\">{{ total.asked }}<\u002Fsc-raw-td>\n          <sc-raw-td style=\"text-align: center; font-family: Figtree; color: #c0392b; font-weight: 700\">{{ total.likely }}<\u002Fsc-raw-td>\n          <sc-raw-td style=\"font-family: Figtree; color: #7a8a5e; font-weight: 700; text-align: center\">{{ total.read }}<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-raw-tbody>\n    <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <div style=\"font-size: 13px; color: var(--color-neutral-600); margin-top: 10px\"><span style=\"color:#c67139;font-weight:700;\">🎯 PYQ<\u002Fspan> (asked in exams) · <span style=\"color:#c0392b;font-weight:700;\">🔥 most likely next<\u002Fspan> · <span style=\"color:#7a8a5e;font-weight:700;\">⭐ worth reading once<\u002Fspan> — click any count to see just those, chapter-wise.<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ALL PENALTIES -->\n  <section id=\"all-penalties\" style=\"order:4;margin-top:60px;\">\n    <div style=\"display:flex;align-items:baseline;gap:12px;padding-bottom:12px;\">\n      <h2 style=\"font-size: 30px; margin: 0; text-transform: uppercase\">All penalties<\u002Fh2>\n      <span style=\"font-size:12px;color:var(--color-neutral-600);\">The full reference — filter, then print your view<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"no-print\" style=\"border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: 20px 22px; margin-top: 14px; display: flex; flex-direction: column; gap: 16px; background-color: var(--color-neutral-100)\">\n      <div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap;\">\n        <div class=\"field\" style=\"flex:1;min-width:220px;\">\n          <input class=\"input\" type=\"text\" placeholder=\"Search section, name or number…\" value=\"{{ search }}\" sc-camel-on-input=\"{{ onSearch }}\">\n        <\u002Fdiv>\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onClear }}\">Clear filters<\u002Fbutton>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px;font-weight:700;\">Chapter<\u002Fdiv>\n        <div class=\"chip-row\">\n          <sc-for list=\"{{ chapterChips }}\" as=\"c\" hint-placeholder-count=\"11\">\n            <button style=\"{{ c.style }}\" sc-camel-on-click=\"{{ c.on }}\">{{ c.label }} <span style=\"opacity:0.6;\">· {{ c.count }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px;font-weight:700;\">Who is liable<\u002Fdiv>\n          <div class=\"chip-row\">\n            <sc-for list=\"{{ liableChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <button style=\"{{ c.style }}\" sc-camel-on-click=\"{{ c.on }}\">{{ c.label }} <span style=\"opacity:0.6;\">· {{ c.count }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px;font-weight:700;\">Severity<\u002Fdiv>\n          <div class=\"chip-row\">\n            <sc-for list=\"{{ severityChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n              <button style=\"{{ c.style }}\" sc-camel-on-click=\"{{ c.on }}\"><span style=\"{{ c.dotStyle }}\"><\u002Fspan>{{ c.label }} <span style=\"opacity:0.6;\">· {{ c.count }}<\u002Fspan><\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px;font-weight:700;\">Quick filters<\u002Fdiv>\n        <div class=\"chip-row\">\n          <button style=\"{{ impStyle }}\" sc-camel-on-click=\"{{ onImp }}\">{{ impLabel }}<\u002Fbutton>\n          <button style=\"{{ askedStyle }}\" sc-camel-on-click=\"{{ onAsked }}\">🎯 {{ askedLabel }}<\u002Fbutton>\n          <button style=\"{{ likelyStyle }}\" sc-camel-on-click=\"{{ onLikely }}\">🔥 {{ likelyLabel }}<\u002Fbutton>\n          <button style=\"{{ readStyle }}\" sc-camel-on-click=\"{{ onRead }}\">⭐ {{ readLabel }}<\u002Fbutton>\n          <button style=\"{{ fraud447Style }}\" sc-camel-on-click=\"{{ onFraud447 }}\">🔗 {{ fraud447Label }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--color-divider);padding-top:14px;flex-wrap:wrap;\">\n        <div style=\"font-size:13px;\"><strong style=\"font-family:var(--font-heading);font-size:17px;\">{{ filteredCount }}<\u002Fstrong> <span style=\"color:var(--color-neutral-600);\">of 82 penalties shown<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--color-neutral-700);\">Tip: your filter decides what prints — hit <strong>Print / Save PDF<\u002Fstrong> for a revision sheet.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"print-only\" style=\"border-bottom:2px solid #000;padding-bottom:8px;margin:10px 0 18px;\">\n      <div style=\"font-family:var(--font-heading);font-size:22px;\">Penalties Master · Compiled by CA Chaitanya Jain (CJ Sir)<\u002Fdiv>\n      <div style=\"font-size:12px;margin-top:4px;\">Filtered view — {{ filterSummary }}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ show447 }}\" hint-placeholder-val=\"{{ false }}\">\n      <article id=\"pen-447\" style=\"display:grid;grid-template-columns:9px 1fr;border-radius:var(--radius-md);overflow:hidden;border:1px solid color-mix(in srgb,#c0392b 45%,var(--color-bg));background:color-mix(in srgb,#c0392b 8%,var(--color-bg));box-shadow:var(--shadow-md);margin-top:20px;\">\n        <div style=\"background:#c0392b;\"><\u002Fdiv>\n        <div style=\"padding:18px 20px;\">\n          <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;\">\n            <span style=\"font-family:var(--font-body);font-weight:700;font-size:12px;padding:4px 13px;border-radius:999px;background:#c0392b;color:#fff;letter-spacing:0.04em;\">FRAUD PENALTY<\u002Fspan>\n            <span style=\"font-family:var(--font-body);font-weight:700;font-size:16px;background:#9c5561;color:#fff;padding:3px 13px;border-radius:999px;line-height:1.5;\">447<\u002Fspan>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:#8f2114;margin-left:auto;\"><span style=\"width:9px;height:9px;border-radius:50%;background:#c0392b;\"><\u002Fspan>Fraud · 447<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--font-body);font-weight:700;font-size:15px;letter-spacing:0.04em;text-transform:uppercase;margin-top:13px;color:#8f2114;\">Section 447 · Punishment for Fraud<\u002Fdiv>\n          <div style=\"font-weight:700;font-size:19px;line-height:1.32;margin-top:7px;text-wrap:pretty;color:var(--color-text);font-family:var(--font-body);\">Punishment for FRAUD — the punishment provision that every ‘read with Section 447’ row routes to.<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;\">\n            <span style=\"font-family:var(--font-body);font-weight:600;font-size:13px;padding:3px 11px;border-radius:999px;color:var(--color-accent-2-800);background-color:var(--color-neutral-100);\">ANY PERSON<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;\">\n            <div style=\"border-radius:12px;border:1px solid color-mix(in srgb,#c0392b 30%,var(--color-bg));background:var(--color-neutral-100);padding:13px 15px;\">\n              <div style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#8f2114;font-weight:700;margin-bottom:7px;\">Main limb — fraud ≥ ₹10 lakh OR ≥ 1% of turnover<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.5;font-family:Figtree;\">Imprisonment <strong>6 months – 10 years<\u002Fstrong> (minimum <strong>3 years<\u002Fstrong> where public interest is involved), <strong>AND<\u002Fstrong> fine = amount involved in the fraud, up to <strong>3× that amount<\u002Fstrong>.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"border-radius:12px;border:1px solid color-mix(in srgb,#c0392b 30%,var(--color-bg));background:var(--color-neutral-100);padding:13px 15px;\">\n              <div style=\"font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#8f2114;font-weight:700;margin-bottom:7px;\">Lesser limb — below ₹10 lakh AND below 1% of turnover, no public interest<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.5;font-family:Figtree;\">Imprisonment up to <strong>5 years<\u002Fstrong>, <strong>OR<\u002Fstrong> fine up to <strong>₹50 lakh<\u002Fstrong>, <strong>OR<\u002Fstrong> both.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:14px;padding:13px 15px;background:var(--color-accent-100);border-radius:var(--radius-md);border-left:4px solid var(--color-accent);\">\n            <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-800);margin-bottom:7px;font-weight:700;\">⚠ Keep in mind · exam takeaway<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;margin-bottom:5px;\">🔗 Section 447 is the PUNISHMENT provision. A charging section only says ‘shall be liable under Section 447’ — the actual jail term and fine live here.<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;margin-bottom:5px;\">⚠ Two tiers: the ₹10 lakh / 1%-of-turnover threshold decides which limb applies. Public-interest fraud carries a minimum 3-year term.<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.5;margin-bottom:5px;\">⭐ ‘Fraud’ is defined in the Explanation to Section 447 — act, omission, concealment or abuse of position with intent to deceive or gain undue advantage; wrongful gain / loss need not be present.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:10px;padding:13px 15px;background:var(--color-accent-2-100);border-radius:var(--radius-md);border-left:4px solid var(--color-accent-2);\">\n            <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-2-800);margin-bottom:9px;font-weight:700;\">🔗 10 sections route to Section 447 — tap to jump<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n              <sc-for list=\"{{ c447chips }}\" as=\"c\" hint-placeholder-count=\"10\">\n                <button sc-camel-on-click=\"{{ c.onJump }}\" style=\"displ "font-size: {{ dfs }}px; line-height: 1.45; font-weight: 700; font-family: Figtree\">{{ il }}<\u002Fdiv><\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"background:var(--color-neutral-100);padding:10px 12px;\">\n                    <div style=\"font-size: 13.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-neutral-600); margin-bottom: 5px; font-weight: 700; text-align: left\">Who is liable / responsible<\u002Fdiv>\n                    <sc-for list=\"{{ item.bothLines }}\" as=\"bl\" hint-placeholder-count=\"1\"><div style=\"font-size: {{ dfs }}px; line-height: 1.45; font-weight: 700; font-family: Figtree\">{{ bl }}<\u002Fdiv><\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div class=\"no-print\" style=\"display:flex;gap:8px;margin-top:13px;flex-wrap:wrap;\">\n                  <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ item.onT }}\" style=\"font-family: Figtree; font-weight: 700; color: #982F15\">⚠ {{ item.tBtn }}<\u002Fbutton>\n                  <sc-if value=\"{{ item.hasSimilar }}\" hint-placeholder-val=\"{{ false }}\">\n                    <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ item.onC }}\" style=\"font-family: Figtree; font-weight: 700; color: #982F15\">🔗 {{ item.cBtn }}<\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <div class=\"reveal-panel {{ item.tClass }}\" style=\"margin-top:13px;padding:13px 15px;background:var(--color-accent-100);border-radius:var(--radius-md);border-left:4px solid var(--color-accent);\">\n                  <div style=\"font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--color-accent-800);margin-bottom:7px;font-weight:700;\">⚠ Keep in mind · exam takeaway<\u002Fdiv>\n                  <sc-for list=\"{{ item.special }}\" as=\"sp\" hint-placeholder-count=\"1\"><div style=\"font-size:13.5px;line-height:1.5;margin-bottom:5px;\">{{ sp }}<\u
