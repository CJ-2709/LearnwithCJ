 text-transform: uppercase\">Penal Interest<\u002Fh2>\n      <span style=\"font-size:12px;color:var(--color-neutral-600);\">Interest rates &amp; multipliers<\u002Fspan>\n      <button class=\"btn btn-secondary no-print\" sc-camel-on-click=\"{{ onToggleRates }}\" style=\"margin-left: auto; flex: none; font-family: Figtree; font-weight: 700\">{{ ratesBtn }}<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"{{ ratesStyle }}border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);background:var(--color-surface);\">\n      <sc-raw-table class=\"table\" style=\"margin:0;\">\n        <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width: 150px; text-align: center; font-size: 12px\">Chapter<\u002Fsc-raw-th><sc-raw-th style=\"text-align: center; font-size: 12px\">Nature<\u002Fsc-raw-th><sc-raw-th style=\"width: 190px; text-align: center; font-size: 12px\">Rate / Figure<\u002Fsc-raw-th><sc-raw-th style=\"text-align: center; font-size: 12px\">What it is<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-for list=\"{{ interest }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <sc-raw-tr><sc-raw-td style=\"font-weight: 600; background-color: var(--color-neutral-100)\">{{ r.ch }}<\u002Fsc-raw-td><sc-raw-td style=\"background-color: var(--color-neutral-100)\">{{ r.nature }}<\u002Fsc-raw-td><sc-raw-td style=\"color: var(--color-accent-800); font-weight: 700; background-color: var(--color-neutral-100)\">{{ r.rate }}<\u002Fsc-raw-td><sc-raw-td style=\"font-size: 13px; color: var(--color-neutral-700); background-color: var(--color-neutral-100)\">{{ r.desc }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <div class=\"no-print\" style=\"{{ ratesHiddenNote }}font-size:12px;color:var(--color-neutral-600);padding:14px 0;\">This section is hidden and won't print. Use “Show section” above to bring it back.<\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"order: 7; margin-top: 56px; border-radius: var(--radius-lg); padding: 24px 26px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background-color: var(--color-accent-100)\">\n    <img src=\"4f357985-1e61-4ab6-9f8f-1aab3ddde84b\" alt=\"CJ Sir logo\" style=\"width: 92px; height: 87px; object-fit: contain; flex: none\">\n    <div>\n      <div style=\"font-family:var(--font-heading);font-size:18px;\">Compiled by CA Chaitanya Jain (CJ Sir)<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--color-neutral-700);margin-top:3px;max-width:70ch;\">All penalties at one place · CA Intermediate — Corporate &amp; Other Laws. To save as PDF, click <strong>Print / Save PDF<\u002Fstrong> and choose “Save as PDF” as the destination.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <!-- Repeating print footer (logo on every printed A4 page) -->\n  <div class=\"print-footer\">\n    <img src=\"4f357985-1e61-4ab6-9f8f-1aab3ddde84b\" alt=\"\" style=\"height:24px;width:24px;object-fit:contain;flex:none;\">\n    <span style=\"font-family:var(--font-heading);font-size:12px;color:#201e1d;\">CA Chaitanya Jain (CJ Sir)<\u002Fspan>\n    <span style=\"font-size:10px;color:#666;\">· Penalties Master · CA Inter — Corporate &amp; Other Laws<\u002Fspan>\n  <\u002Fdiv>\n\n  <!-- Back to top -->\n  <button class=\"no-print\" sc-camel-on-click=\"{{ onBackTop }}\" title=\"Back to top\" style=\"position:fixed;right:20px;bottom:20px;z-index:40;width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;background:var(--color-accent);color:#fff;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;\">\n    <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5\"><\u002Fpath><path d=\"M5 12l7-7 7 7\"><\u002Fpath><\u002Fsvg>\n  <\u002Fbutton>\n\n  <!-- Teaching annotation toolbar (screen only) -->\n  <div class=\"no-print\" style=\"position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;display:flex;gap:8px;align-items:center;background:var(--color-neutral-900);padding:8px 12px;border-radius:999px;box-shadow:var(--shadow-lg);\">\n    <span style=\"font-family:var(--font-body);font-weight:700;font-size:10px;letter-spacing:0.08em;color:rgba(255,255,255,0.55);text-transform:uppercase;\">Pen<\u002Fspan>\n    <div style=\"display:flex;gap:2px;\">\n      <button style=\"{{ toolOffStyle }}\" sc-camel-on-click=\"{{ penOff }}\" title=\"Cursor / off\">✕<\u002Fbutton>\n      <button style=\"{{ toolHiStyle }}\" sc-camel-on-click=\"{{ penHi }}\" title=\"Highlighter\">▬<\u002Fbutton>\n      <button style=\"{{ toolPenStyle }}\" sc-camel-on-click=\"{{ penPen }}\" title=\"Pen\">✎<\u002Fbutton>\n      <button style=\"{{ toolEraseStyle }}\" sc-camel-on-click=\"{{ penErase }}\" title=\"Eraser\">⌫<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"width:1px;height:22px;background:rgba(255,255,255,0.25);\"><\u002Fdiv>\n    <div style=\"display:flex;gap:6px;align-items:center;\">\n      <sc-for list=\"{{ penColors }}\" as=\"pc\" hint-placeholder-count=\"4\">\n        <button style=\"{{ pc.style }}\" sc-camel-on-click=\"{{ pc.on }}\" title=\"Colour\"><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"width:1px;height:22px;background:rgba(255,255,255,0.25);\"><\u002Fdiv>\n    <button style=\"{{ toolPlainStyle }}\" sc-camel-on-click=\"{{ penUndo }}\" title=\"Undo\">↶<\u002Fbutton>\n    <button style=\"{{ toolPlainStyle }}\" sc-camel-on-click=\"{{ penClear }}\" title=\"Clear all ink\">Clear<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:900},&quot;textSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Standard&quot;,&quot;options&quot;:[&quot;Standard&quot;,&quot;Large&quot;,&quot;Extra large&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;defaultExpanded&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;showPageRefs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    data: null,\n    chapters: [], liable: [], severity: [],\n    impOnly: false, groupSel: [], search: '', fraud447: false,\n    openT: [], openC: [], openTop: [], expandAll: false, highlightId: null,\n    hideRates: false,\n    penTool: 'off', penColor: '#ffd400',\n  };\n\n  componentDidMount() {\n    this.ink = { tool: 'off', color: '#ffd400' };\n    this.strokes = [];\n    this.sized = false;\n    this.setupInk();\n    const applyData = () => this.setState({ data: window.PENALTIES_DATA, expandAll: !!this.props.defaultExpanded });\n    if (window.PENALTIES_DATA) { applyData(); }\n    else {\n      let tries = 0;\n      const t = setInterval(() => {\n        if (window.PENALTIES_DATA || tries++ > 100) { clearInterval(t); if (window.PENALTIES_DATA) applyData(); }\n      }, 20);\n    }\n  }\n\n  componentWillUnmount() {\n    if (this._onResize) window.removeEventListener('resize', this._onResize);\n    const c = document.getElementById('ink-canvas');\n    if (c) c.remove();\n  }\n\n  chColor(ch) {\n    const M = { 2:'#c67139', 3:'#4e7a6b', 4:'#cba43a', 5:'#7a8a5e', 6:'#9c5561', 7:'#c0693a', 8:'#5f7a4a', 9:'#4a6d8c', 10:'#a3495e', 11:'#3f6b4f', 12:'#d6a24a', 13:'#8a5a3c', 14:'#5b6a8a', 15:'#a34e2f' };\n    return M[+ch] || 'var(--color-accent)';\n  }\n  tintOf(c, p) { return 'color-mix(in srgb, ' + c + ' ' + p + '%, var(--color-bg))'; }\n  inkOf(c) { return 'color-mix(in srgb, ' + c + ' 62%, var(--color-text))'; }\n\n  applyFilter(chapter, group) {\n    this.setState({\n      chapters: chapter ? [chapter] : [], liable: [], severity: [],\n      impOnly: false, groupSel: group ? [group] : [], search: '', fraud447: false,\n    });\n    setTimeout(() => {\n      const el = document.getElementById('all-penalties');\n      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 66, behavior: 'smooth' });\n    }, 50);\n  }\n\n  setupInk() {\n    if (typeof document === 'undefined') return;\n    const old = document.getElementById('ink-canvas');\n    if (old) old.remove();\n    const c = document.createElement('canvas');\n    c.id = 'ink-canvas';\n    c.width = 0; c.height = 0;\n    document.body.appendChild(c);\n    this.inkCanvas = c;\n    this.inkCtx = c.getContext('2d');\n    this.ink = this.ink || { tool: 'off', color: '#ffd400' };\n    this.strokes = this.strokes || [];\n    this._onResize = () => { if (this.sized) this.sizeInk(); };\n    window.addEventListener('resize', this._onResize);\n    let cur = null;\n    const pt = (e) => ({ x: e.pageX, y: e.pageY });\n    c.addEventListener('pointerdown', (e) => {\n      if (this.ink.tool === 'off') return;\n      cur = { tool: this.ink.tool, color: this.ink.color, points: [pt(e)] };\n      this.strokes.push(cur);\n      this.drawStroke(cur);\n      try { c.setPointerCapture(e.pointerId); } catch (x) {}\n      e.preventDefault();\n    });\n    c.addEventListener('pointermove', (e) => {\n      if (!cur) return;\n      const p = pt(e), a = cur.points[cur.points.length - 1];\n      cur.points.push(p);\n      this.segTo(cur, a, p);\n    });\n    const end = () => { cur = null; };\n    c.addEventListener('pointerup', end);\n    c.addEventListener('pointercancel', end);\n  }\n\n  sizeInk() {\n    const c = this.inkCanvas; if (!c) return;\n    const w = document.documentElement.clientWidth;\n    const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);\n    if (c.width === w && c.height === h) return;\n    c.width = w; c.height = h;\n    c.style.width = w + 'px'; c.style.height = h + 'px';\n    this.sized = true;\n    this.redraw();\n  }\n\n  strokeStyleFor(ctx, s) {\n    ctx.lineCap = 'round'; ctx.lineJoin = 'round';\n    if (s.tool === 'erase') {\n      ctx.globalCompositeOperation = 'destination-out';\n      ctx.strokeStyle = 'rgba(0,0,0,1)'; ctx.lineWidth = 26;\n    } else if (s.tool === 'hi') {\n      ctx.globalCompositeOperation = 'source-over';\n      ctx.strokeStyle = this.hexA(s.color, 0.32); ctx.lineWidth = 18;\n    } else {\n      ctx.globalCompositeOperation = 'source-over';\n      ctx.strokeStyle = s.color; ctx.lineWidth = 3;\n    }\n  }\n  segTo(s, a, b) {\n    const ctx = this.inkCtx; if (!ctx) return;\n    this.strokeStyleFor(ctx, s);\n    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();\n  }\n  drawStroke(s) {\n    const ctx = this.inkCtx; if (!ctx || !s.points.length) return;\n    this.strokeStyleFor(ctx, s);\n    ctx.beginPath();\n    const p0 = s.points[0];\n    ctx.moveTo(p0.x, p0.y);\n    if (s.points.length === 1) { ctx.lineTo(p0.x + 0.1, p0.y + 0.1); }\n    else s.points.forEach(p => ctx.lineTo(p.x, p.y));\n    ctx.stroke();\n  }\n  redraw() {\n    const ctx = this.inkCtx; if (!ctx) return;\n    ctx.clearRect(0, 0, this.inkCanvas.width, this.inkCanvas.height);\n    (this.strokes || []).forEach(s => this.drawStroke(s));\n  }\n  undoInk() {\n    if (!this.strokes || !this.strokes.length) return;\n    this.strokes.pop();\n    this.redraw();\n  }\n  clearInk() {\n    this.strokes = [];\n    if (this.inkCtx) this.inkCtx.clearRect(0, 0, this.inkCanvas.width, this.inkCanvas.height);\n  }\n  hexA(hex, a) {\n    const m = hex.replace('#', '');\n    const r = parseInt(m.substring(0, 2), 16), g = parseInt(m.substring(2, 4), 16), b = parseInt(m.substring(4, 6), 16);\n    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';\n  }\n  setTool(t) {\n    this.ink = this.ink || { tool: 'off', color: '#ffd400' };\n    this.ink.tool = t;\n    if (t !== 'off') this.sizeInk();\n    if (this.inkCanvas) {\n      this.inkCanvas.style.pointerEvents = t === 'off' ? 'none' : 'auto';\n      this.inkCanvas.style.cursor = t === 'off' ? 'default' : 'crosshair';\n    }\n    this.setState({ penTool: t });\n  }\n  pickColor(c) {\n    this.ink = this.ink || { tool: 'off', color: '#ffd400' };\n    this.ink.color = c;\n    const t = (this.ink.tool === 'off' || this.ink.tool === 'erase') ? 'hi' : this.ink.tool;\n    this.setState({ penColor: c });\n    this.setTool(t);\n  }\n  toolBtnStyle(on) {\n    return 'display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 8px;cursor:pointer;font-family:var(--font-body);font-weight:700;font-size:13px;border-radius:999px;color:#fff;border:1px solid ' + (on ? '#fff' : 'transparent') + ';background:' + (on ? 'rgba(255,255,255,0.20)' : 'transparent') + ';';\n  }\n  numChip(n, color) {\n    return React.createElement('span', { style: {\n      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',\n      width: '19px', height: '19px', borderRadius: '50%', background: color, color: '#fff',\n      fontFamily: 'var(--font-heading)', fontSize: '11px', flex: 'none',\n    } }, String(n));\n  }\n\n  toggleIn(key, val) {\n    this.setState(s => {\n      const arr = s[key].slice();\n      const i = arr.indexOf(val);\n      if (i >= 0) arr.splice(i, 1); else arr.push(val);\n      return { [key]: arr };\n    });\n  }\n\n  clearFilters() {\n    this.setState({ chapters: [], liable: [], severity: [], impOnly: false, groupSel: [], search: '', fraud447: false });\n  }\n\n  buckets(p) {\n    const s = [];\n    p.liable.forEach(l => {\n      if (/COMPANY/.test(l) && !s.includes('Company')) s.push('Company');\n      if (/OFFICER/.test(l) && !s.includes('Officer')) s.push('Officer');\n      if (/ANY PERSON/.test(l) && !s.includes('Any Person')) s.push('Any Person');\n      if ((/PARTNER/.test(l) || /LLP/.test(l)) && !s.includes('LLP / Partner')) s.push('LLP / Partner');\n    });\n    return s;\n  }\n\n  hu(s) {\n    return String(s)\n      .replace(/\\br\\/w\\b/gi, 'read with')\n      .replace(/\\bu\\/s\\b/gi, 'under Section')\n      .replace(/\\bw\\.r\\.e\\.f\\.?/gi, 'with retrospective effect from')\n      .replace(/\\bp\\.a\\.\\b/gi, 'per annum')\n      .replace(/\\bre\\.\\s/gi, 'regarding ')\n      .replace(/\\bincl\\.\\s/gi, 'including ')\n      .replace(/\\bEg\\b\\.?/g, 'For example')\n      .replace(/\\be\\.g\\.,?\\s*/gi, 'for example ')\n      .replace(/\\betc\\.?/gi, 'and so on')\n      .replace(/\\bvs\\b\\.?/gi, 'versus')\n      .replace(/\\byrs\\b/gi, 'years')\n      .replace(/\\byr\\b/gi, 'year')\n      .replace(/\\bmth\\b/gi, 'months')\n      .replace(/\\bSec\\b\\.?/g, 'Section')\n      .replace(/\\bCo\\.(?=\\s|$)/g, 'Company')\n      .replace(/\\bDPs\\b/g, 'Designated Partners')\n      .replace(/\\bDP\\b/g, 'Designated Partner')\n      .replace(/\\bs\\.(\\d)/g, 'Section $1');\n  }\n  huLines(s) { return this.hu(s).split('\\n'); }\n  fmtPyq(c) { return String(c).replace(/^([A-Za-z])'?(\\d{2})$/, \"$1'$2\"); }\n  fmtPage(p) { return String(p).replace(/^Pg\\s*/i, 'ICAI Module, page '); }\n\n  jump(id) {\n    this.setState({ chapters: [], liable: [], severity: [], impOnly: false, groupSel: [], search: '', fraud447: false, highlightId: id });\n    setTimeout(() => {\n      const el = document.getElementById('pen-' + id);\n      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 74, behavior: 'smooth' });\n    }, 60);\n    setTimeout(() => { if (this.state.highlightId === id) this.setState({ highlightId: null }); }, 2600);\n  }\n\n  chipStyle(active, color) {\n    const c = color || 'var(--color-accent)';\n    const base = 'display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:7px 14px;cursor:pointer;font-family:var(--font-body);line-height:1.1;border-radius:999px;';\n    return active\n      ? base + 'border:1px solid ' + c + ';background:' + c + ';color:#fff;'\n      : base + 'border:1px solid var(--color-divider);background:var(--color-bg);color:var(--color-text);';\n  }\n\n  renderVals() {\n    const st = this.state;\n    const anC = ['#c67139', '#7a8a5e', '#b8860b', '#4a6d8c', '#c0392b', '#4e7a6b', '#9c5561', '#5f7a4a'];\n    const tsz = this.props.textSize || 'Standard';\n    const nfs = tsz === 'Extra large' ? 24 : tsz === 'Large' ? 21 : 19;\n    const dfs = tsz === 'Extra large' ? 16 : tsz === 'Large' ? 14.5 : 13.5;\n    const base = {\n      onPrint: () => window.print(),\n      onBackTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),\n      an1: this.numChip(1, anC[0]), an2: this.numChip(2, anC[1]), an3: this.numChip(3, anC[2]), an4: this.numChip(4, anC[3]),\n      an5: this.numChip(5, anC[4]), an6: this.numChip(6, anC[5]), an7: this.numChip(7, anC[6]), an8: this.numChip(8, anC[7]),\n      nfs, dfs,\n      onExpandAll: () => this.setState(s => ({ expandAll: !s.expandAll })),\n      onSearch: (e) => this.setState({ search: e.target.value }),\n      onClear: () => this.clearFilters(),\n      onImp: () => this.setState(s => ({ impOnly: !s.impOnly })),\n      onAsked: () => this.toggleIn('groupSel', 'asked'),\n      onLikely: () => this.toggleIn('groupSel', 'likely'),\n      onRead: () => this.toggleIn('groupSel', 'read'),\n      onFraud447: () => this.setState(s => ({ fraud447: !s.fraud447, chapters: [], liable: [], severity: [], impOnly: false, groupSel: [], search: '' })),\n      fraud447Style: this.chipStyle(st.fraud447, '#c0392b'),\n      fraud447Label: 'Fraud · 447',\n      onToggleRates: () => this.setState(s => ({ hideRates: !s.hideRates })),\n      penOff: () => this.setTool('off'),\n      penHi: () => this.setTool('hi'),\n      penPen: () => this.setTool('pen'),\n      penErase: () => this.setTool('erase'),\n      penUndo: () => this.undoInk(),\n      penClear: () => this.clearInk(),\n      toolOffStyle: this.toolBtnStyle(st.penTool === 'off'),\n      toolHiStyle: this.toolBtnStyle(st.penTool === 'hi'),\n      toolPenStyle: this.toolBtnStyle(st.penTool === 'pen'),\n      toolEraseStyle: this.toolBtnStyle(st.penTool === 'erase'),\n      toolPlainStyle: this.toolBtnStyle(false),\n      penColors: ['#ffd400', '#37c26a', '#ff4d8d', '#3aa0ff', '#ec3013'].map(c => ({\n        style: 'width:20px;height:20px;border-radius:50%;cursor:pointer;padding:0;background:' + c + ';border:2px solid ' + (st.penColor === c ? '#fff' : 'rgba(255,255,255,0.35)') + ';',\n        on: () => this.pickColor(c),\n      })),\n      showPageRefs: this.props.showPageRefs !== false,\n      pad: this.props.compact ? '13px 15px' : '16px 18px',\n      expandLabel: st.expandAll ? 'Collapse all' : 'Expand all takeaways',\n      search: st.search,\n      impStyle: this.chipStyle(st.impOnly, '#8a5a3c'),\n      askedStyle: this.chipStyle(st.groupSel.includes('asked'), '#c67139'),\n      likelyStyle: this.chipStyle(st.groupSel.includes('likely'), '#c0392b'),\n      readStyle: this.chipStyle(st.groupSel.includes('read'), '#7a8a5e'),\n      ratesBtn: st.hideRates ? 'Show section' : 'Hide from view & print',\n      ratesStyle: st.hideRates ? 'display:none;' : '',\n      ratesHiddenNote: st.hideRates ? '' : 'display:none;',\n    };\n\n    const d = st.data;\n    if (!d) return {\n      ...base, ready: false, chapterIndex: [], groups: [],\n      chapterChips: [], liableChips: [], severityChips: [], interest: [],\n      total: { count: 82, asked: 8, likely: 6, read: 9 },\n      impLabel: 'IMP · 23', askedLabel: 'PYQ · 8', likelyLabel: 'Most likely · 6', readLabel: 'Worth reading · 9',\n      banner: { show: false },\n      show447: false, c447chips: [],\n      filteredCount: 0, filterSummary: '', noResults: false,\n    };\n\n    const byId = {};\n    d.penalties.forEach(p => { byId[p.id] = p; });\n    const C447IDS = ['2.2', '2.3', '3.3', '3.5', '3.6', '4.1', '4.7', '6.2', '7.6', '10.6'];\n    const realChapters = d.chapterIndex.filter(ci => /^\\d+$/.test(String(ci.ch)));\n\n    const impSet = new Set(d.penalties.filter(p => p.imp).map(p => p.id));\n\n    const chs = st.chapters, sev = st.severity, lb = st.liable, q = st.search.trim().toLowerCase();\n    const match = (p) => {\n      if (st.fraud447 && !C447IDS.includes(p.id)) return false;\n      if (chs.length && !chs.includes(p.chapter)) return false;\n      if (sev.length && !sev.includes(p.color)) return false;\n      if (st.impOnly && !p.imp) return false;\n      if (st.groupSel.length && !st.groupSel.includes(p.group)) return false;\n      if (lb.length) { const b = this.buckets(p); if (!lb.some(x => b.includes(x))) return false; }\n      if (q && !(p.id + ' ' + p.section + ' ' + p.name + ' ' + p.liable.join(' ')).toLowerCase().includes(q)) return false;\n      return true;\n    };\n    const filtered = d.penalties.filter(match);\n\n    const SEV = {\n      GREEN: { c: '#3f7d52', label: 'Fine only' },\n      YELLOW: { c: '#c98a12', label: 'Imprisonment possible' },\n      RED: { c: '#c0392b', label: 'Fraud · 447' },\n    };\n    const GRP = {\n      asked: { c: '#c67139', label: '🎯 PYQ' },\n      likely: { c: '#c0392b', label: '🔥 LIKELY NEXT' },\n      read: { c: '#7a8a5e', label: '⭐ READ ONCE' },\n    };\n    const expand = st.expandAll;\n\n    const mkItem = (p) => {\n      const tOpen = expand || st.openT.includes(p.id);\n      const cOpen = st.openC.includes(p.id);\n      const impLines = p.hasImprisonment ? this.huLines(p.imprisonment) : ['— No imprisonment'];\n      const sv = SEV[p.color];\n      const chC = this.chColor(p.chapter);\n      const similarItems = p.similar.map(id => {\n        const t = byId[id];\n        if (!t) return null;\n        return {\n          id, color: SEV[t.color].c,\n          short: this.hu(t.name.length > 52 ? t.name.slice(0, 52) + '…' : t.name),\n          onJump: () => this.jump(id),\n        };\n      }).filter(Boolean);\n      const gm = GRP[p.group] || { c: 'var(--color-accent)', label: '' };\n      return {\n        id: p.id, imp: p.imp,\n        groupLabel: gm.label,\n        groupTagStyle: 'font-family:var(--font-body);font-weight:700;font-size:12px;padding:4px 11px;border-radius:999px;white-space:nowrap;background:' + gm.c + ';color:#fff;',\n        pyqStyle: 'font-family:var(--font-body);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;border:1.5px solid #c67139;color:#9a5228;',\n        pyqList: p.pyq.map(c => this.fmtPyq(c)),\n        section: p.section, page: this.fmtPage(p.page),\n        sectionColor: this.inkOf(chC),\n        name: this.hu(p.name), liableList: p.liable,\n        nameStyle: 'font-family:var(--font-body);font-weight:700;font-size:' + nfs + 'px;line-height:1.32;margin-top:7px;text-wrap:pretty;color:var(--color-text);',\n        cardStyle: 'display:grid;grid-template-columns:9px 1fr;border-radius:var(--radius-md);overflow:hidden;border:1px solid ' + this.tintOf(sv.c, 45) + ';background:' + this.tintOf(sv.c, 7) + ';box-shadow:var(--shadow-sm);',\n        stripeStyle: 'background:' + sv.c + ';',\n        chipStyle: 'font-family:var(--font-body);font-weight:700;font-size:16px;background:' + chC + ';color:#fff;padding:3px 13px;border-radius:999px;line-height:1.5;',\n        stripe: sv.c, sevLabel: sv.label, sevInk: this.inkOf(sv.c),\n        fineLines: this.huLines(p.fine), impLines, bothLines: this.huLines(p.both),\n        special: p.special.map(x => this.hu(x)),\n        hasSimilar: similarItems.length > 0, similarItems,\n        tClass: tOpen ? 'open' : '', cClass: cOpen ? 'open' : '',\n        tBtn: tOpen ? 'Hide takeaway' : 'Show exam takeaway',\n        cBtn: cOpen ? 'Hide connections' : ('Show ' + similarItems.length + ' connected'),\n        onT: () => this.toggleIn('openT', p.id),\n        onC: () => this.toggleIn('openC', p.id),\n        cardClass: st.highlightId === p.id ? 'pen-hi' : '',\n      };\n    };\n\n    const groups = [];\n    realChapters.forEach(ci => {\n      const items = filtered.filter(p => p.chapter === +ci.ch).map(mkItem);\n      if (items.length) {\n        const chC = this.chColor(ci.ch);\n        groups.push({\n          ch: +ci.ch, title: ci.title.replace(/^Chapter \\d+ — /, ''), count: items.length, items,\n          color: chC, headBg: this.tintOf(chC, 14), ink: this.inkOf(chC),\n        });\n      }\n    });\n\n    const grpN = (ch, g) => d.penalties.filter(p => p.chapter === +ch && p.group === g).length;\n    const cellColor = { asked: '#c67139', likely: '#c0392b', read: '#7a8a5e' };\n    const cell = (ch, n, g) => ({\n      v: n ? String(n) : '–',\n      on: () => this.applyFilter(+ch, n ? g : null),\n      style: 'text-align:right;font-weight:800;cursor:pointer;color:' + (n ? cellColor[g] : 'var(--color-neutral-400)') + ';',\n    });\n    const chapterIndex = realChapters.map(ci => ({\n      ch: ci.ch, count: ci.count, color: this.chColor(ci.ch),\n      shortTitle: ci.title.replace(/^Chapter \\d+ — /, ''),\n      onAll: () => this.applyFilter(+ci.ch, null),\n      asked: cell(ci.ch, grpN(ci.ch, 'asked'), 'asked'),\n      likely: cell(ci.ch, grpN(ci.ch, 'likely'), 'likely'),\n      read: cell(ci.ch, grpN(ci.ch, 'read'), 'read'),\n    }));\n\n    const impCount = d.penalties.filter(p => p.imp).length;\n    const askedCount = d.penalties.filter(p => p.group === 'asked').length;\n    const likelyCount = d.penalties.filter(p => p.group === 'likely').length;\n    const readCount = d.penalties.filter(p => p.group === 'read').length;\n\n    const chapterChips = realChapters.map(ci => ({\n      label: 'Ch ' + ci.ch, count: ci.count, on: () => this.toggleIn('chapters', +ci.ch),\n      style: this.chipStyle(chs.includes(+ci.ch), this.chColor(ci.ch)),\n    }));\n    const liableChips = ['Company', 'Officer', 'Any Person', 'LLP / Partner'].map(l => ({\n      label: l, count: d.penalties.filter(p => this.buckets(p).includes(l)).length,\n      on: () => this.toggleIn('liable', l), style: this.chipStyle(lb.includes(l), 'var(--color-accent-2)'),\n    }));\n    const sevCount = { GREEN: 0, YELLOW: 0, RED: 0 };\n    d.penalties.forEach(p => { sevCount[p.color]++; });\n    const severityChips = [['GREEN', 'Fine only'], ['YELLOW', 'Imprisonment possible'], ['RED', 'Fraud · 447']].map(([k, label]) => ({\n      label, count: sevCount[k], on: () => this.toggleIn('severity', k), style: this.chipStyle(sev.includes(k), SEV[k].c),\n      dotStyle: 'width:9px;height:9px;border-radius:50%;flex:none;background:' + SEV[k].c + ';',\n    }));\n\n    const sevLabelOf = { GREEN: 'Fine only', YELLOW: 'Imprisonment possible', RED: 'Fraud · 447' };\n    const parts = [];\n    if (chs.length) parts.push('Chapters ' + chs.slice().sort((a, b) => a - b).join(', '));\n    if (lb.length) parts.push('Liable: ' + lb.join(', '));\n    if (sev.length) parts.push('Severity: ' + sev.map(k => sevLabelOf[k]).join(', '));\n    if (st.impOnly) parts.push('IMP only');\n    if (st.groupSel.length) parts.push('Group: ' + st.groupSel.map(g => ({ asked: 'PYQ', likely: 'Most likely', read: 'Worth reading' }[g])).join(', '));\n    if (q) parts.push('Search \"' + st.search.trim() + '\"');\n    if (st.fraud447) parts.push('Fraud · Section 447 + 10 connected');\n    const filterSummary = (parts.length ? parts.join(' · ') : 'All chapters, all penalties') + ' — ' + filtered.length + ' of 82 shown';\n\n    const anyFilter = chs.length || sev.length || lb.length || st.impOnly || st.groupSel.length || q;\n    const show447 = st.fraud447 || !anyFilter;\n    const c447chips = C447IDS.map(id => {\n      const t = byId[id];\n      return t ? { id, section: t.section, short: this.hu(t.name.length > 44 ? t.name.slice(0, 44) + '…' : t.name), onJump: () => this.jump(id) } : null;\n    }).filter(Boolean);\n\n    const chPrefix = chs.length === 1 ? 'Chapter ' + chs[0] + ' · ' : (chs.length > 1 ? 'Selected chapters · ' : '');\n    const bDefs = {\n      asked: { icon: '🎯', c: '#c67139', title: 'Previously asked in exams (PYQ)', sub: 'These penalties have already come in ICAI papers — your highest priority.' },\n      likely: { icon: '🔥', c: '#c0392b', title: 'Most likely to be asked next', sub: 'Heavy or fraud-linked penalties. Not asked yet, but prepare these thoroughly.' },\n      read: { icon: '⭐', c: '#7a8a5e', title: 'Worth reading once', sub: 'Important enough to read carefully at least once.' },\n    };\n    let banner = { show: false };\n    const bStyle = (c) => 'display:flex;gap:14px;align-items:flex-start;margin-top:20px;padding:18px 20px;border-radius:var(--radius-lg);border-left:6px solid ' + c + ';background:' + this.tintOf(c, 12) + ';';\n    if (st.groupSel.length === 1) {\n      const g = st.groupSel[0], def = bDefs[g];\n      banner = { show: true, icon: def.icon, style: bStyle(def.c), title: chPrefix + def.title, sub: filtered.length + ' penalt' + (filtered.length === 1 ? 'y' : 'ies') + ' shown. ' + def.sub };\n    } else if (st.impOnly) {\n      banner = { show: true, icon: '📌', style: bStyle('#8a5a3c'), title: chPrefix + 'The IMP ' + impSet.size + ' — your must-focus penalties', sub: filtered.length + ' shown — the penalties worth the most marks, split into PYQ, most-likely-next and worth-reading.' };\n    } else if (st.groupSel.length > 1) {\n      banner = { show: true, icon: '⭐', style: bStyle('var(--color-accent)'), title: chPrefix + 'Selected importance groups', sub: filtered.length + ' penalties shown across the groups you picked.' };\n    }\n\n    return {\n      ...base, ready: true, chapterIndex, groups,\n      chapterChips, liableChips, severityChips, interest: d.interest,\n      total: { count: 82, asked: askedCount, likely: likelyCount, read: readCount },\n      impLabel: 'IMP · ' + impCount,\n      askedLabel: 'PYQ · ' + askedCount,\n      likelyLabel: 'Most likely · ' + likelyCount,\n      readLabel: 'Worth reading · ' + readCount,\n      banner,\n      show447, c447chips,\n      filteredCount: filtered.length, filterSummary, noResults: filtered.length === 0,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
