/* ---------- SCHEDULING ENGINE (with class-day support) ----------
   Pour chapter blocks (with fixed hours) into daily law-buckets.
   Early days can be "class days" with a SMALLER law bucket (or zero, if the
   student didn't pick law that day). Leftovers carry forward. Blocks are
   tagged by phase ("R1","R2","ONLY"). A mock paper is an indivisible 3h sitting.

   dayCapacities: array giving the law hours available on each day, in order.
   Days beyond the array use `normalPerDay`. */
function buildSchedule(phases, dayCapacities, normalPerDay, maxDays, chapterOrder, dayMeta) {
  const seq = chapterOrder ? chapterOrder.map(n => CHAPTERS.find(c => c.n === n)).filter(Boolean) : CHAPTERS;

  // Work entirely in whole minutes to avoid decimal-hour rounding artifacts.
  const H2M = h => Math.round(h * 60);
  const snap5 = m => Math.round(m / 5) * 5; // nearest 5 minutes

  const stream = [];
  phases.forEach(ph => {
    if (ph.marker) {
      stream.push({
        marker: ph.marker,
        phase: ph.marker,
        min: H2M(ph.hours)
      });
      return;
    }
    seq.forEach(c => {
      if (c[ph.key] > 0) stream.push({
        n: c.n,
        name: c.name,
        phase: ph.label,
        min: H2M(c[ph.key])
      });
    });
  });
  const days = [];
  let dayIndex = 0;
  const capacityForDay = i => H2M(i < dayCapacities.length ? dayCapacities[i] : normalPerDay);
  const metaForDay = i => dayMeta && i < dayMeta.length ? dayMeta[i] : null;
  let capacity = capacityForDay(0); // minutes left in the current day
  let day = {
    segments: [],
    meta: metaForDay(0)
  };
  const pushDay = () => {
    days.push(day);
    dayIndex += 1;
    day = {
      segments: [],
      meta: metaForDay(dayIndex)
    };
    capacity = capacityForDay(dayIndex);
  };
  const skipZeroCapacityDays = () => {
    while (capacity <= 0 && day.segments.length === 0) {
      pushDay();
      if (days.length >= maxDays * 4) break;
    }
  };
  const addSeg = (block, mins) => {
    // store both hours (for existing display code) and minutes
    day.segments.push({
      n: block.n,
      name: block.name,
      phase: block.phase,
      hours: mins / 60,
      min: mins
    });
  };
  for (const block of stream) {
    if (block.marker) {
      if (day.segments.length) pushDay();
      skipZeroCapacityDays();
      day.segments.push({
        marker: block.marker,
        phase: block.phase,
        hours: block.min / 60,
        min: block.min
      });
      pushDay();
      continue;
    }
    let remaining = block.min; // whole minutes left of this chapter
    while (remaining > 0) {
      if (capacity <= 0) {
        pushDay();
        skipZeroCapacityDays();
        if (days.length >= maxDays * 4) break;
      }
      let take = Math.min(remaining, capacity);
      // Snap the placed slice to the nearest 5 minutes — EXCEPT when this slice
      // finishes the chapter (take === remaining), so the chapter totals exactly.
      if (take < remaining) {
        const snapped = snap5(take);
        // keep it within the day's capacity and leave at least something for carry
        if (snapped > 0 && snapped <= capacity && snapped < remaining) {
          take = snapped;
        }
      }
      addSeg(block, take);
      remaining -= take;
      capacity -= take;
    }
  }
  if (day.segments.length) pushDay();
  return days;
}
